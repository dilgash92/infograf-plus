<section class="interactive-map-section" aria-labelledby="interactive-map-title">
  <div class="section-heading">
    <div><span class="section-kicker">استكشف العالم</span><h2 id="interactive-map-title">خريطة Infograf+ التفاعلية</h2></div>
    <span class="section-count">اضغط على أي دولة</span>
  </div>
  <div class="interactive-map-card">
    <div class="interactive-map-toolbar">
      <label class="interactive-map-search"><span>ابحث عن دولة</span><input type="search" id="interactive-map-search" placeholder="مثلاً Germany" autocomplete="off"></label>
      <div class="interactive-map-hint">تكبير وتحريك الخريطة متاحان</div>
    </div>
    <div class="interactive-map-stage">
      <div class="interactive-map-loading" id="interactive-map-loading">جاري تحميل الخريطة…</div>
      <svg id="interactive-world-map" viewBox="0 0 960 500" role="img" aria-labelledby="interactive-map-title interactive-map-description">
        <desc id="interactive-map-description">خريطة عالم تفاعلية، اضغط على دولة لعرض اسمها.</desc>
      </svg>
    </div>
    <div class="interactive-map-info" id="interactive-map-info" aria-live="polite">
      <div class="interactive-map-info-placeholder"><span class="interactive-map-info-plus" aria-hidden="true">+</span><div><strong>اختر دولة من الخريطة</strong><span>ستظهر هنا معلوماتها ويمكن لاحقاً ربطها بإنفوغرافيكات Infograf+.</span></div></div>
    </div>
  </div>
  <script type="module">
    (() => {
      const root=document.querySelector('.interactive-map-section');
      if(!root || root.dataset.mapReady==='1') return;
      root.dataset.mapReady='1';
      const svg=root.querySelector('#interactive-world-map');
      const loading=root.querySelector('#interactive-map-loading');
      const info=root.querySelector('#interactive-map-info');
      const search=root.querySelector('#interactive-map-search');
      const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
      const showInfo=d=>{
        const name=d?.properties?.name||'دولة';
        info.innerHTML='<div class="interactive-map-info-placeholder"><span class="interactive-map-info-plus" aria-hidden="true">+</span><div><strong>'+esc(name)+'</strong><span>تم اختيار الدولة. هذه النسخة تعرض الخريطة أولاً، ويمكن ربطها لاحقاً ببيانات موثقة وإنفوغرافيكات مرتبطة بها.</span></div></div>';
      };
      Promise.all([
        import('https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm'),
        import('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm')
      ]).then(async ([d3m,tm])=>{
        const d3=d3m.default||d3m, topo=tm.default||tm;
        const world=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json');
        if(!world || !world.objects || !world.objects.countries) throw new Error('World map data unavailable');
        const countries=topo.feature(world,world.objects.countries).features;
        const width=960,height=500;
        const projection=d3.geoNaturalEarth1().fitSize([width-28,height-28],{type:'Sphere'});
        const path=d3.geoPath(projection);
        svg.innerHTML='';
        const layer=d3.select(svg).append('g');
        layer.append('path').datum({type:'Sphere'}).attr('class','interactive-map-sphere').attr('d',path);
        const countryPaths=layer.selectAll('.interactive-map-country').data(countries).join('path').attr('class','interactive-map-country').attr('d',path).attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.properties?.name||'دولة')
          .on('click',(e,d)=>{countryPaths.classed('is-selected',false);d3.select(e.currentTarget).classed('is-selected',true);showInfo(d);})
          .on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();countryPaths.classed('is-selected',false);d3.select(e.currentTarget).classed('is-selected',true);showInfo(d);}});
        const zoom=d3.zoom().scaleExtent([1,6]).on('zoom',e=>layer.attr('transform',e.transform));
        d3.select(svg).call(zoom);
        const focus=term=>{
          const q=term.trim().toLowerCase(); if(!q)return;
          const match=countries.find(d=>String(d.properties?.name||'').toLowerCase().includes(q)); if(!match)return;
          const node=countryPaths.filter(d=>d===match).node(); if(!node)return;
          countryPaths.classed('is-selected',false);d3.select(node).classed('is-selected',true);showInfo(match);
          const b=path.bounds(match),dx=b[1][0]-b[0][0],dy=b[1][1]-b[0][1],x=(b[0][0]+b[1][0])/2,y=(b[0][1]+b[1][1])/2;
          const scale=Math.max(1,Math.min(5,.75/Math.max(dx/width,dy/height)));
          const t=[width/2-scale*x,height/2-scale*y];
          d3.select(svg).transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(t[0],t[1]).scale(scale));
        };
        search.addEventListener('input',()=>{if(search.value.trim().length>=2)focus(search.value);});
        loading.hidden=true;
      }).catch(()=>{loading.textContent='تعذر تحميل الخريطة الآن. حاول تحديث الصفحة.';loading.classList.add('is-error');});
    })();
  </script>
</section>
