<section class="interactive-map-section" aria-labelledby="interactive-map-title">
  <div class="section-heading">
    <div><span class="section-kicker">استكشف العالم</span><h2 id="interactive-map-title">خريطة Infograf+ التفاعلية</h2></div>
    <span class="section-count" id="interactive-map-count">اختر دولة</span>
  </div>

  <div class="interactive-map-card">
    <div class="interactive-map-toolbar">
      <label class="interactive-map-search">
        <span>ابحث عن دولة</span>
        <input type="search" id="interactive-map-search" placeholder="ابحث عن دولة" autocomplete="off">
      </label>
      <div class="interactive-map-metric-wrap">
        <label for="interactive-map-metric">عرض البيانات</label>
        <select id="interactive-map-metric">
          <option value="population">عدد السكان</option>
        </select>
      </div>
      <div class="interactive-map-hint">اضغط على دولة للتفاصيل · اسحب للتنقل</div>
    </div>

    <div class="interactive-map-stage">
      <div class="interactive-map-loading" id="interactive-map-loading">جاري تحميل الخريطة والبيانات…</div>
      <svg id="interactive-world-map" viewBox="0 0 960 500" role="img" aria-labelledby="interactive-map-title interactive-map-description">
        <desc id="interactive-map-description">خريطة عالم تفاعلية تعرض عدد سكان الدول، مع إمكانية اختيار دولة لعرض بياناتها وإنفوغرافيكات Infograf+ المرتبطة بها.</desc>
      </svg>
    </div>

    <div class="interactive-map-legend" id="interactive-map-legend" aria-label="دليل ألوان الخريطة"></div>

    <div class="interactive-map-info" id="interactive-map-info" aria-live="polite">
      <div class="interactive-map-info-placeholder">
        <span class="interactive-map-info-plus" aria-hidden="true">+</span>
        <div><strong>اختر دولة من الخريطة</strong><span>ستظهر بياناتها وأحدث الإنفوغرافيكات المرتبطة بها.</span></div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const root=document.querySelector('.interactive-map-section');
      if(!root || root.dataset.mapReady==='1') return;
      root.dataset.mapReady='1';

      const svg=root.querySelector('#interactive-world-map');
      const loading=root.querySelector('#interactive-map-loading');
      const info=root.querySelector('#interactive-map-info');
      const search=root.querySelector('#interactive-map-search');
      const metricSelect=root.querySelector('#interactive-map-metric');
      const legend=root.querySelector('#interactive-map-legend');
      const count=root.querySelector('#interactive-map-count');

      const infographicPosts=[
        {% for post in site.posts %}
        {
          title:{{ post.title | jsonify }},
          url:{{ post.url | relative_url | jsonify }},
          description:{{ post.description | default: "" | jsonify }},
          countries:{{ post.countries | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ];

      const aliases={
        "Afghanistan":["أفغانستان"],
        "Albania":["ألبانيا"],
        "Algeria":["الجزائر"],
        "Argentina":["الأرجنتين"],
        "Armenia":["أرمينيا"],
        "Australia":["أستراليا"],
        "Austria":["النمسا"],
        "Azerbaijan":["أذربيجان"],
        "Bahrain":["البحرين"],
        "Bangladesh":["بنغلادش","بنغلاديش"],
        "Belgium":["بلجيكا"],
        "Brazil":["البرازيل"],
        "Bulgaria":["بلغاريا"],
        "Canada":["كندا"],
        "Chile":["تشيلي"],
        "China":["الصين"],
        "Colombia":["كولومبيا"],
        "Croatia":["كرواتيا"],
        "Cyprus":["قبرص"],
        "Czechia":["التشيك"],
        "Denmark":["الدنمارك"],
        "Egypt":["مصر"],
        "Estonia":["إستونيا"],
        "Ethiopia":["إثيوبيا"],
        "Finland":["فنلندا"],
        "France":["فرنسا"],
        "Georgia":["جورجيا"],
        "Germany":["ألمانيا"],
        "Greece":["اليونان"],
        "Hungary":["المجر","هنغاريا"],
        "India":["الهند"],
        "Indonesia":["إندونيسيا"],
        "Iran":["إيران"],
        "Iraq":["العراق"],
        "Ireland":["أيرلندا"],
        "Israel":["إسرائيل"],
        "Italy":["إيطاليا"],
        "Japan":["اليابان"],
        "Jordan":["الأردن"],
        "Kazakhstan":["كازاخستان"],
        "Kenya":["كينيا"],
        "Kuwait":["الكويت"],
        "Lebanon":["لبنان"],
        "Libya":["ليبيا"],
        "Lithuania":["ليتوانيا"],
        "Malaysia":["ماليزيا"],
        "Malta":["مالطا"],
        "Mexico":["المكسيك"],
        "Morocco":["المغرب"],
        "Netherlands":["هولندا","الأراضي المنخفضة"],
        "New Zealand":["نيوزيلندا"],
        "Nigeria":["نيجيريا"],
        "Norway":["النرويج"],
        "Oman":["عُمان","عمان"],
        "Pakistan":["باكستان"],
        "Palestine":["فلسطين"],
        "Peru":["بيرو"],
        "Poland":["بولندا"],
        "Portugal":["البرتغال"],
        "Qatar":["قطر"],
        "Romania":["رومانيا"],
        "Russia":["روسيا"],
        "Saudi Arabia":["السعودية","المملكة العربية السعودية"],
        "Serbia":["صربيا"],
        "Singapore":["سنغافورة"],
        "Slovakia":["سلوفاكيا"],
        "Slovenia":["سلوفينيا"],
        "South Africa":["جنوب أفريقيا"],
        "South Korea":["كوريا الجنوبية"],
        "Spain":["إسبانيا"],
        "Sudan":["السودان"],
        "Sweden":["السويد"],
        "Switzerland":["سويسرا"],
        "Syria":["سوريا"],
        "Tunisia":["تونس"],
        "Türkiye":["تركيا"],
        "Turkey":["تركيا"],
        "Ukraine":["أوكرانيا"],
        "United Arab Emirates":["الإمارات","الإمارات العربية المتحدة"],
        "United Kingdom":["بريطانيا","المملكة المتحدة"],
        "United States":["أمريكا","الولايات المتحدة","الولايات المتحدة الأمريكية"],
        "Uruguay":["الأوروغواي"],
        "Venezuela":["فنزويلا"],
        "Vietnam":["فيتنام"],
        "Yemen":["اليمن"]
      };

      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
      const norm=v=>String(v??'').toLowerCase().normalize('NFKD').replace(/[\u064B-\u065F\u0670]/g,'').replace(/أ|إ|آ/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/gu,' ').trim();

      let d3, topo, countries=[], countryPaths, zoom, populationRows=[], selectedCountry=null;

      function countryNames(d){
        const name=String(d?.properties?.name||'');
        return [name,...(aliases[name]||[])];
      }

      function findCountry(query){
        const q=norm(query);
        if(!q) return null;
        return countries.find(d=>countryNames(d).some(n=>norm(n)===q || norm(n).includes(q) || q.includes(norm(n))))||null;
      }

      function postMatches(post,country){
        const names=countryNames(country).map(norm).filter(Boolean);
        const explicit=Array.isArray(post.countries)?post.countries:[post.countries].filter(Boolean);
        if(explicit.some(v=>names.includes(norm(v)))) return true;
        const hay=norm([post.title,post.description].join(' '));
        return names.some(n=>n.length>2 && hay.includes(n));
      }

      function getPopulation(country){
        const names=countryNames(country).map(norm);
        return populationRows.find(r=>names.includes(norm(r.name?.common||r.name||'')))||null;
      }

      function populationValue(row){\n        if(!row) return null;\n        const key=Object.keys(row).find(k=>/^Population(?:$| -)/.test(k));\n        return key ? Number(row[key]) : null;\n      }\n\n      function formatPopulation(value){
        if(value==null || !Number.isFinite(Number(value))) return 'غير متاح';
        const n=Number(value);
        if(n>=1000000000) return (n/1000000000).toFixed(n>=10000000000?1:2).replace(/\.0+$/,'')+' مليار';
        if(n>=1000000) return (n/1000000).toFixed(n>=100000000?1:2).replace(/\.0+$/,'')+' مليون';
        if(n>=1000) return Math.round(n/1000).toLocaleString('ar-EG')+' ألف';
        return Math.round(n).toLocaleString('ar-EG');
      }

      function renderLegend(){
        legend.innerHTML='<span>عدد السكان</span><i></i><small>أقل</small><i></i><i></i><i></i><i></i><small>أكثر</small>';
      }

      function colorScale(value,max){
        if(value==null || !max) return '#e8e8ec';
        const ratio=Math.max(0,Math.min(1,Number(value)/max));
        const alpha=.10+(ratio*.72);
        return 'color-mix(in srgb, var(--accent) '+Math.round(alpha*100)+'%, var(--surface-soft))';
      }

      function renderInfo(country){
        selectedCountry=country;
        const name=country?.properties?.name||'دولة';
        const pop=getPopulation(country);
        const related=infographicPosts.filter(p=>postMatches(p,country)).slice(0,4);
        count.textContent=related.length ? related.length+' إنفوغرافيك مرتبط' : 'لا توجد نتائج مرتبطة بعد';

        const relatedHtml=related.length
          ? '<div class="interactive-map-posts"><div class="interactive-map-posts-title">إنفوغرافيكات مرتبطة بـ '+esc(name)+'</div><div class="interactive-map-post-list">'+related.map(p=>'<a href="'+esc(p.url)+'"><span>+</span><strong>'+esc(p.title)+'</strong><em>←</em></a>').join('')+'</div></div>'
          : '<div class="interactive-map-posts"><div class="interactive-map-posts-title">إنفوغرافيكات مرتبطة</div><p>لا توجد منشورات موسومة بهذه الدولة حالياً. عند إضافة <code>countries:</code> إلى المنشور سيظهر هنا بدقة.</p></div>';

        info.innerHTML='<div class="interactive-map-country-info"><div class="interactive-map-country-heading"><span class="interactive-map-info-plus" aria-hidden="true">+</span><div><strong>'+esc(name)+'</strong><span>بيانات السكان من الأمم المتحدة عبر Our World in Data</span></div></div><div class="interactive-map-stat"><small>عدد السكان</small><b>'+formatPopulation(populationValue(pop))+'</b><span>آخر سنة متاحة: '+esc(pop?.Year||'غير متاح')+'</span></div>'+relatedHtml+'</div>';
      }

      function selectCountry(country,zoomTo=false){
        if(!country) return;
        countryPaths.classed('is-selected',false);
        const node=countryPaths.filter(d=>d===country).node();
        if(node) d3.select(node).classed('is-selected',true);
        renderInfo(country);
        if(zoomTo){
          const width=960,height=500,path=d3.geoPath(projection),b=path.bounds(country),dx=b[1][0]-b[0][0],dy=b[1][1]-b[0][1],x=(b[0][0]+b[1][0])/2,y=(b[0][1]+b[1][1])/2;
          const scale=Math.max(1,Math.min(5,.75/Math.max(dx/width,dy/height)));
          const t=[width/2-scale*x,height/2-scale*y];
          d3.select(svg).transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(t[0],t[1]).scale(scale));
        }
      }

      let projection;

      Promise.all([
        import('https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm'),
        import('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm')
      ]).then(async ([d3m,tm])=>{
        d3=d3m.default||d3m;
        topo=tm.default||tm;

        // Render the map independently first. External statistics must never block the map.
        const world=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json');
        if(!world?.objects?.countries) throw new Error('World map data unavailable');
        countries=topo.feature(world,world.objects.countries).features;

        const width=960,height=500;
        projection=d3.geoNaturalEarth1().fitSize([width-28,height-28],{type:'Sphere'});
        const path=d3.geoPath(projection);
        svg.innerHTML='';
        const layer=d3.select(svg).append('g');
        layer.append('path').datum({type:'Sphere'}).attr('class','interactive-map-sphere').attr('d',path);

        countryPaths=layer.selectAll('.interactive-map-country').data(countries).join('path')
          .attr('class','interactive-map-country')
          .attr('d',path)
          .attr('tabindex',0)
          .attr('role','button')
          .attr('aria-label',d=>countryNames(d)[0])
          .style('fill','var(--surface-soft)')
          .on('click',(e,d)=>selectCountry(d))
          .on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectCountry(d);}});

        zoom=d3.zoom().scaleExtent([1,6]).on('zoom',e=>layer.attr('transform',e.transform));
        d3.select(svg).call(zoom);
        renderLegend();
        loading.hidden=true;

        // Population is loaded after the map so a slow/blocked API cannot leave the map stuck.
        d3.json('https://restcountries.com/v3.1/all?fields=name,population,cca3').then(apiCountries=>{
          if(!Array.isArray(apiCountries)) return;
          populationRows=apiCountries.filter(r=>r?.name?.common && Number.isFinite(Number(r.population)));
          const maxPopulation=Math.max(...countries.map(c=>populationValue(getPopulation(c))||0));
          countryPaths.style('fill',d=>colorScale(populationValue(getPopulation(d)),maxPopulation));
          if(selectedCountry) renderInfo(selectedCountry);
        }).catch(error=>console.warn('Population data unavailable',error));

        search.addEventListener('input',()=>{
          const value=search.value.trim();
          if(value.length<2) return;
          const match=findCountry(value);
          if(match) selectCountry(match,true);
        });

        metricSelect.addEventListener('change',()=>{metricSelect.value='population';});
        loading.hidden=true;
      }).catch(error=>{
        console.error('Interactive map error',error);
        loading.textContent='تعذر تحميل بيانات الخريطة الآن. حاول تحديث الصفحة.';
        loading.classList.add('is-error');
      });
    })();
  </script>
</section>
