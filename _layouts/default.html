<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | Infograf+
    {% else %}
      Infograf+
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}">

  <meta
    name="theme-color"
    content="#635BFF">

  <meta
    name="mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default">

  <link
    rel="manifest"
    href="{{ '/manifest.json' | relative_url }}">

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}">

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

</head>


<body>


  <!-- ==================================================
       HEADER
       ================================================== -->

  <header class="site-header">

    <div class="header-inner">


      <!-- Logo -->

      <a
        href="{{ '/' | relative_url }}"
        class="brand"
        aria-label="Infograf+">

        <span class="brand-name">
          Infograf
        </span>

        <span class="brand-plus">
          +
        </span>

      </a>


      <!-- Desktop Navigation -->

      <nav
        class="desktop-navigation"
        aria-label="التنقل الرئيسي">


        <a
          href="{{ '/' | relative_url }}"
          class="nav-link">

          الرئيسية

        </a>


        <a
          href="{{ '/categories.html' | relative_url }}"
          class="nav-link">

          الأقسام

        </a>


        <a
          href="{{ '/#latest' | relative_url }}"
          class="nav-link">

          الأحدث

        </a>


      </nav>


      <!-- Search -->

      <button
        type="button"
        class="search-button"
        id="open-search"
        aria-label="فتح البحث">

        <span
          class="search-icon"
          aria-hidden="true">

          ⌕

        </span>

      </button>


    </div>

  </header>



  <!-- ==================================================
       SEARCH
       ================================================== -->

  <div
    class="search-panel"
    id="search-panel"
    hidden>

    <div class="search-panel-inner">


      <div class="search-header">

        <h2>
          ابحث في Infograf+
        </h2>


        <button
          type="button"
          id="close-search"
          class="close-search"
          aria-label="إغلاق البحث">

          ×

        </button>

      </div>


      <label
        for="site-search"
        class="visually-hidden">

        ابحث في الموقع

      </label>


      <input
        id="site-search"
        type="search"
        placeholder="اكتب كلمة للبحث..."
        autocomplete="off">


      <div
        id="search-results"
        class="search-results">

      </div>


    </div>

  </div>



  <!-- ==================================================
       MAIN CONTENT
       ================================================== -->

  <div class="page-wrapper">

    {{ content }}

  </div>



  <!-- ==================================================
       MOBILE NAVIGATION
       ================================================== -->

  <nav
    class="mobile-navigation"
    aria-label="التنقل في الموقع">


    <!-- Home -->

    <a
      href="{{ '/' | relative_url }}"
      class="mobile-nav-item">

      <span
        class="mobile-nav-icon"
        aria-hidden="true">

        ⌂

      </span>

      <span>
        الرئيسية
      </span>

    </a>


    <!-- Categories -->

    <a
      href="{{ '/categories.html' | relative_url }}"
      class="mobile-nav-item">

      <span
        class="mobile-nav-icon"
        aria-hidden="true">

        ▦

      </span>

      <span>
        الأقسام
      </span>

    </a>


    <!-- Search -->

    <button
      type="button"
      class="mobile-nav-item mobile-search-trigger"
      id="mobile-search">

      <span
        class="mobile-nav-icon"
        aria-hidden="true">

        ⌕

      </span>

      <span>
        بحث
      </span>

    </button>


    <!-- Latest -->

    <a
      href="{{ '/#latest' | relative_url }}"
      class="mobile-nav-item">

      <span
        class="mobile-nav-icon"
        aria-hidden="true">

        ✦

      </span>

      <span>
        الأحدث
      </span>

    </a>


  </nav>



  <!-- ==================================================
       FOOTER
       ================================================== -->

  <footer class="site-footer">

    <div class="footer-inner">


      <div class="footer-brand">

        <a
          href="{{ '/' | relative_url }}"
          class="brand">

          <span class="brand-name">
            Infograf
          </span>

          <span class="brand-plus">
            +
          </span>

        </a>


        <p>
          معلومات وإنفوغرافيك بطريقة أبسط.
        </p>

      </div>


      <div class="footer-info">

        © {{ 'now' | date: "%Y" }}
        Infograf+

      </div>


    </div>

  </footer>



  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script
    src="{{ '/assets/js/app.js' | relative_url }}">
  </script>


</body>

</html>
