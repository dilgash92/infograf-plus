<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#070313"/><stop offset=".42" stop-color="#1b0b35"/><stop offset=".72" stop-color="#4b1649"/><stop offset="1" stop-color="#160914"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#fff0a5"/><stop offset=".45" stop-color="#ffc14a"/><stop offset=".82" stop-color="#ff8b16"/><stop offset="1" stop-color="#f66b0b"/></radialGradient>
 <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#211033"/><stop offset="1" stop-color="#07050d"/></linearGradient>
 <linearGradient id="fog" x1="0" x2="1"><stop stop-color="#9c56c8" stop-opacity=".02"/><stop offset=".45" stop-color="#d477ff" stop-opacity=".3"/><stop offset="1" stop-color="#ff8c28" stop-opacity=".04"/></linearGradient>
 <linearGradient id="pumpkin" x1="0" x2="1"><stop stop-color="#b83f00"/><stop offset=".45" stop-color="#ff7610"/><stop offset=".62" stop-color="#ff9a21"/><stop offset="1" stop-color="#b83f00"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="smallglow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
