name: Restore Google Cairo font

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Restore Google Cairo font'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-local-font files
        run: |
          git checkout 2e9b9727500e70a2e341e7687a7835b205c512d3 -- _layouts/default.html assets/css/style.css assets/css/dark-mode.css
          git rm -f assets/fonts/Cairo-VariableFont_slnt,wght.ttf 2>/dev/null || true
          git rm -f .github/workflows/restore-google-font.yml 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Google Cairo font"
          git push
