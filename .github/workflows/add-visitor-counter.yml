name: Add visitor counter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-site:
    if: github.event.head_commit.message != 'Add site visitor counter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add visitor counter
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          if "visitor-counter-section" in text:
              raise SystemExit(0)

          block = r'''  <section class="visitor-counter-section" aria-label="إحصائيات الموقع">
    <div class="visitor-counter-card">
      <div class="visitor-counter-mark" aria-hidden="true">+</div>
      <div class="visitor-counter-content">
        <span class="visitor-counter-label">زوار Infograf+</span>
        <strong id="site-visitor-count">—</strong>
        <span class="visitor-counter-caption">زائر للموقع</span>
      </div>
    </div>
  </section>

  <script data-goatcounter="https://dilgashibr.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <script>
    (function () {
      function loadVisitorCount() {
        var target = document.getElementById('site-visitor-count');
        if (!target) return;

        fetch('https://dilgashibr.goatcounter.com/counter/TOTAL.json')
          .then(function (response) {
            if (!response.ok) throw new Error('Visitor count request failed');
            return response.json();
          })
          .then(function (data) {
            if (data && data.count) target.textContent = data.count;
          })
          .catch(function () {
            target.textContent = '—';
          });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadVisitorCount);
      } else {
        loadVisitorCount();
      }
    })();
  </script>

  <style>
    .visitor-counter-section {
      width: min(var(--max-width), calc(100% - 40px));
      margin: 0 auto;
      padding: 0 0 52px;
      display: flex;
      justify-content: center;
    }

    .visitor-counter-card {
      position: relative;
      width: min(360px, 100%);
      min-height: 104px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
    }

    .visitor-counter-card::before {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      left: -70px;
      bottom: -75px;
      border-radius: 50%;
      background: var(--accent-light);
      opacity: .8;
      pointer-events: none;
    }

    .visitor-counter-mark {
      position: relative;
      z-index: 1;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }

    .visitor-counter-content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: baseline;
      column-gap: 8px;
      row-gap: 1px;
      min-width: 0;
    }

    .visitor-counter-label {
      grid-column: 1 / -1;
      color: var(--text-light);
      font-size: 11px;
      font-weight: 600;
    }

    .visitor-counter-content strong {
      color: var(--text);
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: -.5px;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .visitor-counter-caption {
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .visitor-counter-section {
        width: calc(100% - 28px);
        padding-bottom: 42px;
      }

      .visitor-counter-card {
        width: min(340px, 100%);
        min-height: 92px;
        padding: 15px 17px;
        border-radius: 18px;
        gap: 13px;
      }

      .visitor-counter-mark {
        width: 43px;
        height: 43px;
        border-radius: 12px;
        font-size: 27px;
      }

      .visitor-counter-content strong {
        font-size: 24px;
      }
    }
  </style>

'''

          marker = '  <script id="search-index" type="application/json">'
          if marker not in text:
              raise SystemExit("search-index marker not found")

          text = text.replace(marker, block + marker, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add site visitor counter"
          git push
