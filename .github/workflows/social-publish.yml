name: Social publishing

on:
  push:
    branches: [main]
    paths: ['_posts/**.md']

permissions:
  contents: read

jobs:
  publish-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find new posts
        id: posts
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" =~ ^0+$ ]]; then git diff-tree --no-commit-id --name-only -r --diff-filter=A "$GITHUB_SHA" -- '_posts/*.md' > /tmp/new_posts.txt || true; else git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- '_posts/*.md' > /tmp/new_posts.txt || true; fi
          sed -i '/^$/d' /tmp/new_posts.txt
          if [[ -s /tmp/new_posts.txt ]]; then echo 'has_posts=true' >> "$GITHUB_OUTPUT"; else echo 'has_posts=false' >> "$GITHUB_OUTPUT"; fi
      - name: Publish
        if: steps.posts.outputs.has_posts == 'true'
        env:
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          site='https://infografplus.com'; worker='https://calm-dream-ae41.dilgash-ibrahim.workers.dev'
          for path in [x.strip() for x in open('/tmp/new_posts.txt', encoding='utf-8') if x.strip()]:
              text=open(path, encoding='utf-8').read(); fm=re.match(r'^---\\s*\\n(.*?)\\n---', text, re.S).group(1)
              d={}
              for line in fm.splitlines():
                  m=re.match(r'^([A-Za-z0-9_-]+):\\s*(.*)$', line)
                  if m: d[m.group(1)]=m.group(2).strip().strip('"')
              slug=d.get('slug') or re.sub(r'^\\d{4}-\\d{2}-\\d{2}-','',os.path.basename(path)[:-3])
              image=d.get('image',''); image=image if image.startswith('http') else site+'/'+image.lstrip('/')
              url=f'{site}/i/{slug}/'; caption='\\n\\n'.join(x for x in [d.get('title',''),d.get('description',''),url] if x)
              req=urllib.request.Request(worker+'/api/social/publish', data=json.dumps({'image_url':image,'caption':caption},ensure_ascii=False).encode(), method='POST', headers={'Content-Type':'application/json','X-Automation-Key':os.environ['AUTOMATION_SECRET']})
              with urllib.request.urlopen(req, timeout=120) as r: result=json.load(r)
              print(json.dumps(result, ensure_ascii=False))
              if not result.get('ok'): raise SystemExit(1)
          PY