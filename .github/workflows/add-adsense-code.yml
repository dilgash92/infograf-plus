name: Add AdSense code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add AdSense publisher script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_layouts/default.html')
          s = p.read_text()
          marker = '  <script src="{{ site.baseurl }}/assets/js/dark-mode.js" defer></script>\n'
          snippet = '''  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4462989361408671" crossorigin="anonymous"></script>\n'''
          if 'ca-pub-4462989361408671' not in s:
              if marker not in s:
                  raise SystemExit('Expected head marker not found')
              s = s.replace(marker, marker + snippet, 1)
              p.write_text(s)
          else:
              print('AdSense code already present')
          PY

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _layouts/default.html .github/workflows/add-adsense-code.yml
          git rm .github/workflows/add-adsense-code.yml
          git commit -m "Add AdSense publisher code"
          git push origin main
